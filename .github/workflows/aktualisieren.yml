name: Kalender aktualisieren

on:
  schedule:
    # alle 2 Stunden (Zeiten in UTC)
    - cron: "23 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["kurse.json", "kalender.py"]

permissions:
  contents: write

concurrency:
  group: kalender
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kalender aus Friedolin bauen
        run: python3 kalender.py

      - name: Änderungen speichern
        run: |
          git config user.name "kalender-bot"
          git config user.email "kalender-bot@users.noreply.github.com"
          git add kalender.ics
          if ! git diff --cached --quiet; then
            git commit -m "Kalender aktualisiert"
          else
            # GitHub pausiert geplante Abläufe nach 60 Tagen ohne Aktivität.
            # Daher spätestens alle 30 Tage ein kleines Lebenszeichen.
            last=$(git log -1 --format=%ct)
            if [ $(( $(date +%s) - last )) -gt 2592000 ]; then
              date -u +"%Y-%m-%dT%H:%M:%SZ" > zuletzt-geprueft.txt
              git add zuletzt-geprueft.txt
              git commit -m "Lebenszeichen"
            fi
          fi
          git push
