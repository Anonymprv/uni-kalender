name: Kalender aktualisieren

on:
  schedule:
    # alle 2 Stunden (Zeiten in UTC). Der Lauf um 0 Uhr UTC (= 1–2 Uhr nachts
    # in Jena) entfällt, weil Friedolin nachts oft wegen Wartung nicht erreichbar ist.
    - cron: "23 2-22/2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["kurse.json", "kalender.py", "ausfaelle.txt", "sitzungen.json"]

permissions:
  contents: write

concurrency:
  group: kalender
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Ist Friedolin nur kurz nicht erreichbar, bleibt der alte Kalender stehen und
      # der Lauf gilt als erfolgreich (keine Fehler-Mail). Erst wenn 24 Stunden lang
      # kein Abgleich geklappt hat, schlägt der Lauf fehl und GitHub schickt eine Mail.
      - name: Kalender aus Friedolin bauen
        run: python3 kalender.py

      - name: Änderungen speichern
        run: |
          git config user.name "kalender-bot"
          git config user.email "kalender-bot@users.noreply.github.com"
          git add kalender.ics zuletzt-ok.txt 2>/dev/null || git add kalender.ics
          if ! git diff --cached --quiet; then
            git commit -m "Kalender aktualisiert"
            git pull --rebase --quiet
            git push
          fi
